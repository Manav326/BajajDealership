appId: com.quantaedge.luckybajaj
---
# This is a read-only smoke flow: keep the app's local session and never submit forms.
- launchApp
- extendedWaitUntil:
    visible: "LUCKY BAJAJ"
    timeout: 30000
- runFlow:
    when:
      visible: "Sign in securely"
    commands:
      - assertVisible: "A QuantaEdge customer experience"
      - assertVisible: "CUSTOMER CARE, CONNECTED"
      - assertVisible: "Every ride deserves better care."
      - assertVisible: "Sign in"
      - assertVisible: "Activate account"
      - assertVisible: "Dealership code"
      - assertVisible: "Customer code"
      - assertVisible: "Password"
      - tapOn: "Activate account"
      - assertVisible: "One-time activation token"
      - assertVisible: "Create password (12+ characters)"
      - scrollUntilVisible:
          element: "Confirm password"
          direction: DOWN
          timeout: 10000
      - assertVisible: "Confirm password"
      - scrollUntilVisible:
          element: "Activate my account"
          direction: DOWN
          timeout: 10000
      - assertVisible: "Activate my account"
      - scrollUntilVisible:
          element: "Sign in"
          direction: UP
          timeout: 10000
      - tapOn: "Sign in"
      - assertVisible: "Dealership code"
      - assertVisible: "Customer code"
      - scrollUntilVisible:
          element: "Sign in securely"
          direction: DOWN
          timeout: 10000
      - assertVisible: "Sign in securely"
- runFlow:
    when:
      visible: "Customer care"
    commands:
      - assertVisible: "Sign out"
      - assertVisible: "Your ride care, in one place."
      - assertVisible: "YOUR CUSTOMER SPACE"
      - scrollUntilVisible:
          element: "My bikes"
          direction: DOWN
          timeout: 10000
      - assertVisible: "My bikes"
