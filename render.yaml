# Preview deployment only. Do not use this free-tier stack for production customer data.
# Render creates a separate public URL for the staff portal, customer website and API.
services:
  - type: web
    name: lucky-bajaj-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase:
          name: lucky-bajaj-preview-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lucky-bajaj-preview-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lucky-bajaj-preview-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lucky-bajaj-preview-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lucky-bajaj-preview-db
          property: password
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "2"
      - key: APP_VERSION
        value: preview
      - key: APP_BOOTSTRAP_TOKEN
        sync: false
      # Reuse the public Google OAuth web client ID configured for QuantaEdge.
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      # Android OAuth client ID registered for com.quantaedge.luckybajaj and the appropriate signing SHA-1.
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      # Required when this API serves more than one active dealership.
      - key: APP_PUBLIC_DEALERSHIP_CODE
        sync: false
      - key: APP_NOTIFICATION_MEDIA_DIR
        value: /app/var/private-notification-media
      - key: NOTIFICATION_DISPATCH_INTERVAL_MS
        value: "15000"
      - key: SOCIAL_MEDIA_STORAGE_BACKEND
        value: database
      - key: SOCIAL_MEDIA_MEDIA_DIR
        value: ./var/social-media-assets
      - key: SOCIAL_MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: SOCIAL_MEDIA_ASSET_SIGNING_KEY_BASE64
        sync: false
      - key: SOCIAL_MEDIA_PUBLISH_POLL_INTERVAL_MS
        value: "15000"
      - key: SOCIAL_MEDIA_PUBLISH_DISPATCH_INTERVAL_MS
        value: "10000"
      - key: SOCIAL_META_ENABLED
        value: "false"
      - key: SOCIAL_META_APP_ID
        sync: false
      - key: SOCIAL_META_APP_SECRET
        sync: false
      - key: SOCIAL_META_GRAPH_API_VERSION
        sync: false
      - key: SOCIAL_META_REDIRECT_URI
        sync: false
      - key: SOCIAL_META_COMPLETION_URL
        sync: false
      - key: SOCIAL_META_TOKEN_ENCRYPTION_KEY_BASE64
        sync: false
      # WhatsApp uses the configured Meta Graph API version and Meta app secret for webhook validation.
      - key: SOCIAL_WHATSAPP_ENABLED
        value: "false"
      - key: SOCIAL_WHATSAPP_DISPATCH_INTERVAL_MS
        value: "15000"
      - key: SOCIAL_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: SOCIAL_WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: SOCIAL_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: SOCIAL_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: SOCIAL_WHATSAPP_DEALERSHIP_CODE
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN_1
        fromService:
          type: web
          name: lucky-bajaj-staff-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_CORS_ALLOWED_ORIGIN_2
        fromService:
          type: web
          name: lucky-bajaj-customer-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lucky-bajaj-staff-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: lucky-bajaj-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lucky-bajaj-customer-web
    runtime: static
    rootDir: apps/customer-web
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: lucky-bajaj-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: lucky-bajaj-preview-db
    databaseName: bajaj_dealership
    user: bajaj_app
    region: singapore
    plan: free
    postgresMajorVersion: "17"
