name: bajajdealership

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bajaj_dealership}
      POSTGRES_USER: ${POSTGRES_USER:-bajaj_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bajaj_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bajaj_dealership_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bajaj_app} -d ${POSTGRES_DB:-bajaj_dealership}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/manav326/bajajdealership-api:${BAJAJ_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bajaj_dealership}
      DB_USERNAME: ${POSTGRES_USER:-bajaj_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bajaj_local_only}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      APP_VERSION: ${APP_VERSION:-local}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN:-}
      APP_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      APP_AUTH_GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      APP_AUTH_GOOGLE_ANDROID_LIQUID_GLASS_CLIENT_ID: ${GOOGLE_ANDROID_LIQUID_GLASS_CLIENT_ID:-}
      APP_PUBLIC_DEALERSHIP_CODE: ${APP_PUBLIC_DEALERSHIP_CODE:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_CORS_ALLOWED_ORIGIN_1: ${APP_CORS_ALLOWED_ORIGIN_1:-}
      APP_CORS_ALLOWED_ORIGIN_2: ${APP_CORS_ALLOWED_ORIGIN_2:-}
      APP_NOTIFICATION_MEDIA_DIR: /app/var/private-notification-media
      NOTIFICATION_DISPATCH_INTERVAL_MS: ${NOTIFICATION_DISPATCH_INTERVAL_MS:-15000}
      SOCIAL_MEDIA_STORAGE_BACKEND: ${SOCIAL_MEDIA_STORAGE_BACKEND:-database}
      SOCIAL_MEDIA_PUBLIC_BASE_URL: ${SOCIAL_MEDIA_PUBLIC_BASE_URL:-}
      SOCIAL_MEDIA_MEDIA_DIR: ${SOCIAL_MEDIA_MEDIA_DIR:-./var/social-media-assets}
      SOCIAL_MEDIA_ASSET_SIGNING_KEY_BASE64: ${SOCIAL_MEDIA_ASSET_SIGNING_KEY_BASE64:-}
      SOCIAL_MEDIA_PUBLISH_POLL_INTERVAL_MS: ${SOCIAL_MEDIA_PUBLISH_POLL_INTERVAL_MS:-15000}
      SOCIAL_MEDIA_PUBLISH_DISPATCH_INTERVAL_MS: ${SOCIAL_MEDIA_PUBLISH_DISPATCH_INTERVAL_MS:-10000}
      SOCIAL_META_ENABLED: ${SOCIAL_META_ENABLED:-false}
      SOCIAL_META_APP_ID: ${SOCIAL_META_APP_ID:-}
      SOCIAL_META_APP_SECRET: ${SOCIAL_META_APP_SECRET:-}
      SOCIAL_META_GRAPH_API_VERSION: ${SOCIAL_META_GRAPH_API_VERSION:-}
      SOCIAL_META_REDIRECT_URI: ${SOCIAL_META_REDIRECT_URI:-}
      SOCIAL_META_COMPLETION_URL: ${SOCIAL_META_COMPLETION_URL:-}
      SOCIAL_META_TOKEN_ENCRYPTION_KEY_BASE64: ${SOCIAL_META_TOKEN_ENCRYPTION_KEY_BASE64:-}
      SOCIAL_WHATSAPP_ENABLED: ${SOCIAL_WHATSAPP_ENABLED:-false}
      SOCIAL_WHATSAPP_DISPATCH_INTERVAL_MS: ${SOCIAL_WHATSAPP_DISPATCH_INTERVAL_MS:-15000}
      SOCIAL_WHATSAPP_PHONE_NUMBER_ID: ${SOCIAL_WHATSAPP_PHONE_NUMBER_ID:-}
      SOCIAL_WHATSAPP_BUSINESS_ACCOUNT_ID: ${SOCIAL_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      SOCIAL_WHATSAPP_ACCESS_TOKEN: ${SOCIAL_WHATSAPP_ACCESS_TOKEN:-}
      SOCIAL_WHATSAPP_VERIFY_TOKEN: ${SOCIAL_WHATSAPP_VERIFY_TOKEN:-}
      SOCIAL_WHATSAPP_DEALERSHIP_CODE: ${SOCIAL_WHATSAPP_DEALERSHIP_CODE:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - bajaj_dealership_media:/app/var/private-notification-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s
    restart: unless-stopped

  customer-web:
    image: ghcr.io/manav326/bajajdealership-customer-web:${BAJAJ_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/customer-web/Dockerfile
    ports:
      - "${CUSTOMER_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  staff-web:
    image: ghcr.io/manav326/bajajdealership-staff-web:${BAJAJ_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${STAFF_WEB_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  bajaj_dealership_data:
  bajaj_dealership_media:
