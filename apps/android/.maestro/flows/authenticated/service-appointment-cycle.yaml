appId: com.quantaedge.luckybajaj
name: Service appointment request and cancellation
tags:
  - authenticated
  - service
---
- runFlow: ../../subflows/customer-login.yaml
- tapOn: "More"
- tapOn: "Appointments"
- assertVisible: "Service visits"
- tapOn: "${MAESTRO_CUSTOMER_VEHICLE_NAME} · Standard"
- tapOn:
    id: customer-appointment-concern
- inputText: "Maestro automated service appointment test. Please disregard."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: customer-appointment-submit
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: customer-appointment-submit
- scrollUntilVisible:
    element:
      id: customer-appointment-cancel-reason
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: customer-appointment-cancel-reason
- tapOn:
    id: customer-appointment-cancel-reason
- inputText: "Maestro test cleanup"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: customer-appointment-cancel-submit
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: customer-appointment-cancel-submit
- extendedWaitUntil:
    visible: "Cancelled"
    timeout: 20000
