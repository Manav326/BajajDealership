appId: com.quantaedge.luckybajajlg
name: Customer notification inbox pagination
tags:
  - authenticated
  - notification-fixture
---
- runFlow: ../../subflows/customer-login.yaml
- tapOn: "Updates"
- assertVisible: "Dealership updates"
- scrollUntilVisible:
    element:
      text: "Load more updates"
    direction: DOWN
    timeout: 15000
- tapOn: "Load more updates"
- assertVisible: ${MAESTRO_NOTIFICATION_PAGE_TWO_TITLE}
