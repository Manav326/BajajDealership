name: Notification Studio browser regressions

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/customer-web/**'
      - '.github/workflows/notification-studio-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/customer-web/**'
      - '.github/workflows/notification-studio-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Responsive layout and interaction checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web and browser test dependencies
        run: npm install
      - name: Install customer showroom dependencies
        working-directory: apps/customer-web
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive and interaction tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-studio-browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
