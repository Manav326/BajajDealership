name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bajaj_dealership
          POSTGRES_USER: bajaj_app
          POSTGRES_PASSWORD: bajaj_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bajaj_app -d bajaj_dealership"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bajaj_dealership
      DB_USERNAME: bajaj_app
      DB_PASSWORD: bajaj_local_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot API and PostgreSQL migrations
        run: mvn -B -f backend/pom.xml test

  web:
    name: React web builds (staff and customer portal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck and build staff portal
        working-directory: apps/web
        run: npm run build
      - name: Install customer portal dependencies
        working-directory: apps/customer-web
        run: npm install
      - name: Typecheck and build customer portal
        working-directory: apps/customer-web
        run: npm run build
