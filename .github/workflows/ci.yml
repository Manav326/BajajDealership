name: CI

on:
  push:
    branches: [main, 'feat/android-customer-web-parity', 'feature/dealership-licensing-readonly']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep only the newest validation run for each branch/ref. Intermediate main commits are
# superseded by the newest tree, which re-runs the complete test/build matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep both APK pipelines verified together whenever the CI workflow itself changes.
  # Dedicated source/script filters still avoid Android rebuilds for unrelated web/backend edits.
  android-changes:
    name: Detect Android source changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      liquid_glass: ${{ steps.filter.outputs.liquid_glass }}
    steps:
      # Required for push events: dorny/paths-filter compares the pushed tree to its base.
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Android-relevant paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'scripts/test-android-maestro.ps1'
              - 'scripts/android-fetch-latest-apk.ps1'
              - '.github/workflows/ci.yml'
            liquid_glass:
              - 'apps/android-liquid-glass/**'
              - 'scripts/test-android-liquid-glass-maestro.ps1'
              - 'scripts/android-lg-fetch-latest-apk.ps1'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bajaj_dealership
          POSTGRES_USER: bajaj_app
          POSTGRES_PASSWORD: bajaj_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bajaj_app -d bajaj_dealership"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bajaj_dealership
      DB_USERNAME: bajaj_app
      DB_PASSWORD: bajaj_local_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot API and PostgreSQL migrations
        run: mvn -B -f backend/pom.xml test

  web:
    name: Build and publish staff/customer web artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate read-only preview smoke script syntax
        run: node --check scripts/smoke-test-local.mjs

      - name: Install staff portal dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck and build staff portal
        working-directory: apps/web
        run: npm run build
      - name: Upload staff portal website
        id: upload-staff-web
        uses: actions/upload-artifact@v4
        with:
          name: staff-portal-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add staff portal download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-staff-web.outputs.artifact-url }}
        run: |
          {
            echo "### Staff web portal"
            echo "- [Download the built staff portal files]($ARTIFACT_URL)"
            echo "- Contents: Vite production files from `apps/web/dist/` (static files; not a live hosted URL)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install customer portal dependencies
        working-directory: apps/customer-web
        run: npm install
      - name: Typecheck and build customer portal
        working-directory: apps/customer-web
        run: npm run build
      - name: Upload customer portal website
        id: upload-customer-web
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-web-${{ github.sha }}
          path: apps/customer-web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add customer website download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-customer-web.outputs.artifact-url }}
        run: |
          {
            echo "### Customer website"
            echo "- [Download the built customer website files]($ARTIFACT_URL)"
            echo "- Contents: Vite production files from `apps/customer-web/dist/` (static files; not a live hosted URL)."
          } >> "$GITHUB_STEP_SUMMARY"

  docker-stack:
    name: Build and smoke-test local Docker stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate startup scripts
        shell: bash
        run: |
          sh -n scripts/start.sh
          pwsh -NoLogo -NoProfile -Command '$failed=$false; foreach ($path in @("scripts/start.ps1","scripts/test-ui.ps1","scripts/test-android-maestro.ps1","scripts/test-android-liquid-glass-maestro.ps1","scripts/android-fetch-latest-apk.ps1","scripts/android-lg-fetch-latest-apk.ps1","scripts/check-android-edition-parity.ps1")) { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count -gt 0) { foreach ($e in $errors) { Write-Host ("{0}: line {1}, column {2}: {3} ({4})" -f $path,$e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Message,$e.ErrorId) }; $failed=$true } }; if ($failed) { exit 1 }'
      - name: Verify Android edition feature and test parity
        run: pwsh -NoLogo -NoProfile -File scripts/check-android-edition-parity.ps1
      - name: Validate Docker Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          BAJAJ_IMAGE_TAG=ci-validation docker compose -f compose.yaml config --quiet
      - name: Build Spring Boot API and both web images
        run: docker compose -f compose.yaml build --pull api customer-web staff-web
      - name: Start full stack without rebuilding the already-built images
        shell: bash
        run: |
          BAJAJ_IMAGE_TAG=latest docker compose -f compose.yaml up --no-build -d || {
            docker compose -f compose.yaml logs --tail=100
            exit 1
          }
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null \
              && curl -fsS http://localhost:3000/ >/dev/null \
              && curl -fsS http://localhost:3001/ >/dev/null; then
              echo "Customer site, staff portal and API are healthy."
              activation_status="$(curl -sS -o /tmp/staff-activation-response.txt -w '%{http_code}' \
                -X POST \
                -H 'Origin: http://localhost:3001' \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                --data '{"activationToken":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","password":"CI-Activation-Test-Password"}' \
                http://localhost:3001/api/v1/auth/staff/activate)"
              if [ "$activation_status" != "401" ] || grep -q "Invalid CORS request" /tmp/staff-activation-response.txt; then
                echo "Staff activation proxy smoke test failed (HTTP $activation_status):"
                cat /tmp/staff-activation-response.txt
                docker compose -f compose.yaml logs --tail=100
                exit 1
              fi
              echo "Staff activation endpoint passes through the same-origin proxy and returns the expected invalid-invitation response."

              # Real HTTP regression: an anonymous bootstrap POST with a wrong token
              # must reach the controller and return 404 (invalid setup token), not 401.
              check_bootstrap_scope() {
                local url="$1"
                local label="$2"
                local output="$3"
                local status
                status="$(curl -sS -o "$output" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json' \
                  -H 'X-Bootstrap-Token: deliberately-invalid' \
                  --data '{"dealershipCode":"DIAG-ONLY","dealershipName":"Diagnostic only","ownerName":"Diagnostic only","email":"diag@example.test","phone":null,"password":"Secure-Owner-Password-2026"}' \
                  "$url")"
                if [ "$status" != "404" ]; then
                  echo "Anonymous bootstrap $label smoke test failed (HTTP $status):"
                  cat "$output"
                  return 1
                fi
                echo "Anonymous bootstrap $label returns 404 for an invalid setup token, without sign-in."
              }
              check_bootstrap_scope "http://localhost:8080/api/v1/system/bootstrap" "direct API" /tmp/bootstrap-api-response.txt || {
                docker compose -f compose.yaml logs --tail=100
                exit 1
              }
              check_bootstrap_scope "http://localhost:3001/api/v1/system/bootstrap" "staff-web proxy" /tmp/bootstrap-proxy-response.txt || {
                docker compose -f compose.yaml logs --tail=100
                exit 1
              }
              docker compose -f compose.yaml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml logs --tail=150
          exit 1
      - name: Clean up ephemeral Docker stack
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans


  windows-desktop:
    name: Build unsigned direct installers and local-Docker test installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://lucky-bajaj-api.onrender.com/' }}
      VITE_APP_VERSION: "0.1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate Windows desktop downloader PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "apps/web/public/Download-LuckyBajajDesktop.ps1").Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object {
              Write-Error ("Line {0}, column {1}: {2} [{3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
            }
            throw "The Windows desktop downloader contains PowerShell syntax errors."
          }

      - name: Install staff portal dependencies
        working-directory: apps/web
        run: npm install
      - name: Build unsigned NSIS and MSI installers
        working-directory: apps/web
        run: npm run tauri:build
      - name: Verify direct-download installers remain unsigned
        shell: pwsh
        run: |
          $installerPaths = @(
            "apps/web/src-tauri/target/release/bundle/nsis/*.exe"
            "apps/web/src-tauri/target/release/bundle/msi/*.msi"
          )
          $installers = @(
            foreach ($installerPath in $installerPaths) {
              Get-ChildItem -Path $installerPath -File -ErrorAction Stop
            }
          )
          $exeCount = @($installers | Where-Object { $_.Extension -ieq '.exe' }).Count
          $msiCount = @($installers | Where-Object { $_.Extension -ieq '.msi' }).Count
          if ($exeCount -ne 1 -or $msiCount -ne 1) {
            throw "Expected exactly one EXE and one MSI installer; found $exeCount EXE and $msiCount MSI."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected $($installer.Name) to remain unsigned; found $($signature.Status)."
            }
          }
      - name: Upload Windows build validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-windows-builds-${{ github.sha }}
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
      # This second build is deliberately local-only. It is not the customer installer:
      # its API endpoint is the host loopback port published by Docker Compose.
      - name: Build local-Docker Windows test installer
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/
          VITE_APP_VERSION: "0.1.0-local"
        run: npm run tauri:build
      - name: Verify local-Docker EXE and MSI installers remain unsigned
        shell: pwsh
        run: |
          $installerPaths = @(
            "apps/web/src-tauri/target/release/bundle/nsis/*.exe"
            "apps/web/src-tauri/target/release/bundle/msi/*.msi"
          )
          $installers = @(
            foreach ($installerPath in $installerPaths) {
              Get-ChildItem -Path $installerPath -File -ErrorAction Stop
            }
          )
          $exeCount = @($installers | Where-Object { $_.Extension -ieq '.exe' }).Count
          $msiCount = @($installers | Where-Object { $_.Extension -ieq '.msi' }).Count
          if ($exeCount -ne 1 -or $msiCount -ne 1) {
            throw "Expected exactly one local EXE and one local MSI; found $exeCount EXE and $msiCount MSI."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected local installer $($installer.Name) to remain unsigned; found $($signature.Status)."
            }
          }

      - name: Verify local-Docker API URL was embedded in the desktop bundle
        shell: pwsh
        run: |
          $bundles = Get-ChildItem "apps/web/dist-desktop/assets/*.js" -File
          if (-not $bundles) { throw "No desktop JavaScript bundles were produced." }
          $match = Select-String -Path $bundles.FullName -SimpleMatch "http://127.0.0.1:8080"
          if (-not $match) { throw "The local-Docker API URL was not embedded in the desktop build." }
      - name: Upload local-Docker Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-windows-local-docker-${{ github.sha }}
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  windows-store-msix-validation:
    name: Optional Store MSIX packaging validation
    needs: [windows-desktop]
    if: ${{ always() && needs.windows-desktop.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated Windows installer artifact
        id: download-installers
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lucky-bajaj-windows-builds-${{ github.sha }}
          path: windows-installers

      - name: Build and verify development-identity MSIX package
        id: build-msix-validation
        if: steps.download-installers.outcome == 'success'
        timeout-minutes: 12
        continue-on-error: true
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem -Path "windows-installers" -Filter "*.msi" -File -Recurse)
          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI in the validated installer artifact; found $($msis.Count)."
          }
          $params = @{
            MsiPath = $msis[0].FullName
            IconPath = "apps/web/src-tauri/icons/icon.ico"
            PackageName = "QuantaEdge.LuckyBajajDesktop.Dev"
            Publisher = "CN=QuantaEdge Development"
            PublisherDisplayName = "QuantaEdge Development"
            Version = "0.1.0.0"
            OutputPath = "release-validation/LuckyBajajDesktop.StoreValidation.msix"
          }
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-msix.ps1 @params
          if ($LASTEXITCODE -ne 0) { throw "Optional MSIX packaging exited with code $LASTEXITCODE." }

      - name: Upload Store MSIX validation artifact
        if: steps.build-msix-validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lucky-bajaj-windows-msix-validation-${{ github.sha }}
          path: release-validation/LuckyBajajDesktop.StoreValidation.msix
          if-no-files-found: error
          retention-days: 14

      - name: Report optional Store packaging result
        if: steps.build-msix-validation.outcome != 'success'
        shell: pwsh
        run: |
          Write-Warning "Optional Store MSIX validation did not complete. The required EXE/MSI and local-Docker installer artifacts were built independently and are unaffected."

  android:
    name: Build Lucky Bajaj Android APK
    needs: [android-changes]
    # Native Android builds are costly. Build only for Android source changes,
    # or when explicitly requested through workflow_dispatch.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.android-changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Build the APK against the deployed Bajaj API by default.
    # Set BAJAJ_API_BASE_URL for LAN/emulator or staging builds.
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://lucky-bajaj-api.onrender.com/' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/android/package.json
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Match the packages required by Expo SDK 57 / React Native 0.86.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Install mobile dependencies
        working-directory: apps/android
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Check Expo native dependency versions
        working-directory: apps/android
        run: npx expo install --check
      - name: Typecheck Android app
        working-directory: apps/android
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: apps/android
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds restore main's cache; only main updates the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon --build-cache --parallel
      - name: Record Android APK build metadata
        run: |
          node -e "const fs = require('node:fs'); const file = 'apps/android/android/app/build/outputs/apk/debug/build-metadata.json'; const metadata = { edition: 'standard', packageName: 'com.quantaedge.luckybajaj', apiBaseUrl: process.env.EXPO_PUBLIC_API_BASE_URL, commitSha: process.env.GITHUB_SHA }; fs.writeFileSync(file, JSON.stringify(metadata, null, 2));"
      - name: Upload installable debug APK
        id: upload-android-apk
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-android-debug-apk-${{ github.sha }}
          path: |
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/android/app/build/outputs/apk/debug/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Add Android APK download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-android-apk.outputs.artifact-url }}
          API_BASE_URL: ${{ env.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          {
            echo "### Lucky Bajaj Android app"
            echo "- [Download the installable debug APK ZIP]($ARTIFACT_URL)"
            echo "- API base compiled into this APK: `$API_BASE_URL`"
            echo "- This is a debug build, not a signed Play Store release."
          } >> "$GITHUB_STEP_SUMMARY"

  android-liquid-glass:
    name: Build Lucky Bajaj Liquid Glass Android APK
    needs: [android-changes]
    # Native Android builds are costly. Build only for Android source changes,
    # or when explicitly requested through workflow_dispatch.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.android-changes.outputs.liquid_glass == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Build the APK against the deployed Bajaj API by default.
    # Set BAJAJ_API_BASE_URL for LAN/emulator or staging builds.
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://lucky-bajaj-api.onrender.com/' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/android-liquid-glass/package.json
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Match the packages required by Expo SDK 57 / React Native 0.86.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Install mobile dependencies
        working-directory: apps/android-liquid-glass
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Check Expo native dependency versions
        working-directory: apps/android-liquid-glass
        run: npx expo install --check
      - name: Typecheck Android app
        working-directory: apps/android-liquid-glass
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: apps/android-liquid-glass
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds restore main's cache; only main updates the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build debug APK
        working-directory: apps/android-liquid-glass/android
        run: ./gradlew assembleDebug --no-daemon --build-cache --parallel
      - name: Record Android APK build metadata
        run: |
          node -e "const fs = require('node:fs'); const file = 'apps/android-liquid-glass/android/app/build/outputs/apk/debug/build-metadata.json'; const metadata = { edition: 'liquid-glass', packageName: 'com.quantaedge.luckybajajlg', apiBaseUrl: process.env.EXPO_PUBLIC_API_BASE_URL, commitSha: process.env.GITHUB_SHA }; fs.writeFileSync(file, JSON.stringify(metadata, null, 2));"
      - name: Validate Liquid Glass APK build metadata
        run: |
          node -e "const fs = require('node:fs'); const file = 'apps/android-liquid-glass/android/app/build/outputs/apk/debug/build-metadata.json'; const metadata = JSON.parse(fs.readFileSync(file, 'utf8')); if (metadata.edition !== 'liquid-glass' || metadata.packageName !== 'com.quantaedge.luckybajajlg' || !metadata.apiBaseUrl || metadata.commitSha !== process.env.GITHUB_SHA) throw new Error('Liquid Glass APK build metadata is incomplete or does not match this CI commit.');"
      - name: Upload installable debug APK
        id: upload-android-apk
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-android-liquid-glass-debug-apk-${{ github.sha }}
          path: |
            apps/android-liquid-glass/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android-liquid-glass/android/app/build/outputs/apk/debug/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Add Android APK download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-android-apk.outputs.artifact-url }}
          API_BASE_URL: ${{ env.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          {
            echo "### Lucky Bajaj Liquid Glass Android app"
            echo "- [Download the installable debug APK ZIP]($ARTIFACT_URL)"
            echo "- API base compiled into this APK: `$API_BASE_URL`"
            echo "- This is a debug build, not a signed Play Store release."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Publish API and web images to GHCR
    # Android may be skipped for non-mobile changes; still publish images when all
    # required backend/web/Docker checks pass and Android either passes or is skipped.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.backend.result == 'success' && needs.web.result == 'success' && needs['docker-stack'].result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs['android-liquid-glass'].result == 'success' || needs['android-liquid-glass'].result == 'skipped') }}
    needs: [backend, web, docker-stack, android, android-liquid-glass]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/manav326/bajajdealership-api:latest
            ghcr.io/manav326/bajajdealership-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=bajaj-api
          cache-to: type=gha,mode=max,scope=bajaj-api

      - name: Build and publish customer web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/customer-web/Dockerfile
          push: true
          tags: |
            ghcr.io/manav326/bajajdealership-customer-web:latest
            ghcr.io/manav326/bajajdealership-customer-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=bajaj-customer-web
          cache-to: type=gha,mode=max,scope=bajaj-customer-web

      - name: Build and publish staff web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/manav326/bajajdealership-staff-web:latest
            ghcr.io/manav326/bajajdealership-staff-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=bajaj-staff-web
          cache-to: type=gha,mode=max,scope=bajaj-staff-web

      - name: Pull the published GHCR images back from the registry
        run: docker compose -f compose.yaml pull api customer-web staff-web
      - name: Smoke-test the pulled GHCR images without building
        shell: bash
        run: |
          docker compose -f compose.yaml up --no-build -d || {
            docker compose -f compose.yaml logs --tail=100
            exit 1
          }
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null && \
              curl -fsS http://localhost:3000/ >/dev/null && \
              curl -fsS http://localhost:3001/ >/dev/null; then
              echo 'Published GHCR images started successfully without a local build.'
              check_bootstrap_scope() {
                local url="$1"
                local label="$2"
                local output="$3"
                local status
                status="$(curl -sS -o "$output" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json' \
                  -H 'X-Bootstrap-Token: deliberately-invalid' \
                  --data '{"dealershipCode":"DIAG-ONLY","dealershipName":"Diagnostic only","ownerName":"Diagnostic only","email":"diag@example.test","phone":null,"password":"Secure-Owner-Password-2026"}' \
                  "$url")"
                if [ "$status" != "404" ]; then
                  echo "Published-image anonymous bootstrap $label smoke test failed (HTTP $status):"
                  cat "$output"
                  docker compose -f compose.yaml logs --tail=100
                  exit 1
                fi
                echo "Published-image anonymous bootstrap $label correctly rejects the invalid token without sign-in."
              }
              check_bootstrap_scope "http://localhost:8080/api/v1/system/bootstrap" "direct API" /tmp/bootstrap-ghcr-api.txt
              check_bootstrap_scope "http://localhost:3001/api/v1/system/bootstrap" "staff-web proxy" /tmp/bootstrap-ghcr-proxy.txt
              docker compose -f compose.yaml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml logs --tail=150
          exit 1
      - name: Clean up pulled-image smoke-test stack
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
