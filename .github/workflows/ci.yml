name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bajaj_dealership
          POSTGRES_USER: bajaj_app
          POSTGRES_PASSWORD: bajaj_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bajaj_app -d bajaj_dealership"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bajaj_dealership
      DB_USERNAME: bajaj_app
      DB_PASSWORD: bajaj_local_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot API and PostgreSQL migrations
        run: mvn -B -f backend/pom.xml test

  web:
    name: Build and publish staff/customer web artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install staff portal dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck and build staff portal
        working-directory: apps/web
        run: npm run build
      - name: Upload staff portal website
        id: upload-staff-web
        uses: actions/upload-artifact@v4
        with:
          name: staff-portal-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add staff portal download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-staff-web.outputs.artifact-url }}
        run: |
          {
            echo "### Staff web portal"
            echo "- [Download the built staff portal files]($ARTIFACT_URL)"
            echo "- Contents: Vite production files from `apps/web/dist/` (static files; not a live hosted URL)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install customer portal dependencies
        working-directory: apps/customer-web
        run: npm install
      - name: Typecheck and build customer portal
        working-directory: apps/customer-web
        run: npm run build
      - name: Upload customer portal website
        id: upload-customer-web
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-web-${{ github.sha }}
          path: apps/customer-web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add customer website download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-customer-web.outputs.artifact-url }}
        run: |
          {
            echo "### Customer website"
            echo "- [Download the built customer website files]($ARTIFACT_URL)"
            echo "- Contents: Vite production files from `apps/customer-web/dist/` (static files; not a live hosted URL)."
          } >> "$GITHUB_STEP_SUMMARY"

  docker-stack:
    name: Validate Compose and build local Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet
      - name: Build Spring Boot API and both web images
        run: docker compose -f compose.yaml build --pull api customer-web staff-web

  android:
    name: Build Lucky Bajaj Android APK
    runs-on: ubuntu-latest
    # Match mPAY's local phone-over-Wi-Fi API configuration by default.
    # Override the GitHub Actions repository variable BAJAJ_API_BASE_URL for another target.
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'http://192.168.31.47:8080/' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on the hosted runner." >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install mobile dependencies
        working-directory: apps/android
        run: npm install
      - name: Align Expo native dependency versions
        working-directory: apps/android
        run: npx expo install --fix
      - name: Typecheck Android app
        working-directory: apps/android
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: apps/android
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        id: upload-android-apk
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-android-debug-apk-${{ github.sha }}
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add Android APK download to build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-android-apk.outputs.artifact-url }}
          API_BASE_URL: ${{ env.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          {
            echo "### Lucky Bajaj Android app"
            echo "- [Download the installable debug APK ZIP]($ARTIFACT_URL)"
            echo "- API base compiled into this APK: `$API_BASE_URL`"
            echo "- This is a debug build, not a signed Play Store release."
          } >> "$GITHUB_STEP_SUMMARY"
