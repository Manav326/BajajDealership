name: Windows desktop release candidate

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows-release-candidate:
    name: Build unsigned direct installers and Store MSIX
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      VITE_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://lucky-bajaj-api.onrender.com/' }}
      VITE_APP_VERSION: ${{ github.ref_name }}
      MSIX_PACKAGE_IDENTITY_NAME: ${{ vars.MSIX_PACKAGE_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Derive desktop and MSIX versions from release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^desktop-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable tag such as desktop-v1.2.3."
          }
          $configPath = "apps/web/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content -Path $configPath -Encoding utf8
          "VITE_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSIX_VERSION=$version.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate Microsoft Store package identity configuration
        shell: pwsh
        run: |
          $required = @('MSIX_PACKAGE_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing repository Actions variable $name. Reserve the app in Partner Center and configure its exact identity values."
            }
          }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install staff portal dependencies
        working-directory: apps/web
        run: npm install
      - name: Build unsigned NSIS and MSI installers
        working-directory: apps/web
        run: npm run tauri:build
      - name: Stage direct-download installers and verify unsigned status
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps/web/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "apps/web/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Both EXE and MSI installers are required." }
          foreach ($installer in @($exe, $msi)) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected unsigned direct installer; found $($signature.Status) on $($installer.Name)."
            }
          }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $exe.FullName "release-assets/LuckyBajajDesktopSetup.exe"
          Copy-Item $msi.FullName "release-assets/LuckyBajajDesktop.msi"
      - name: Build unsigned MSIX for Microsoft Store submission
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/web/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $params = @{
            MsiPath = $msi.FullName
            IconPath = "apps/web/src-tauri/icons/icon.ico"
            PackageName = $env:MSIX_PACKAGE_IDENTITY_NAME
            Publisher = $env:MSIX_PUBLISHER
            PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
            Version = $env:MSIX_VERSION
            OutputPath = "release-assets/LuckyBajajDesktopStore.msix"
          }
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-msix.ps1 @params
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem "release-assets/*" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            }
          $lines | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding ascii
      - name: Open draft release for review and Microsoft Store submission
        uses: softprops/action-gh-release@v2
        with:
          name: "Lucky Bajaj Desktop ${{ github.ref_name }} (draft)"
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## Direct-download packages
            LuckyBajajDesktopSetup.exe and LuckyBajajDesktop.msi are intentionally unsigned.
            Windows may show Unknown Publisher or SmartScreen warnings. This is expected.
            Verify SHA-256 values in SHA256SUMS.txt and download only from the official page.
            Do not disable Windows security protections.

            ## Microsoft Store package
            LuckyBajajDesktopStore.msix is a separate unsigned package for Partner Center submission.
            Microsoft re-signs MSIX packages after Store certification. Do not distribute this MSIX directly.

            This release is a draft pending clean-Windows install, sign-in, licensing, package identity and Store certification checks.
          files: |
            release-assets/LuckyBajajDesktopSetup.exe
            release-assets/LuckyBajajDesktop.msi
            release-assets/LuckyBajajDesktopStore.msix
            release-assets/SHA256SUMS.txt
