name: Android emulator UI smoke and authenticated regression

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/android-liquid-glass/**'
      - 'backend/**'
      - 'compose.yaml'
      - '.github/compose.ci.yaml'
      - '.github/scripts/npm-install-retry.mjs'
      - '.github/scripts/validate-ci-compose.mjs'
      - '.github/workflows/android-emulator-smoke.yml'
      - '.github/scripts/run-android-maestro-public.sh'
      - '.github/scripts/run-android-maestro-ci.sh'
      - '.github/scripts/seed-android-maestro-authenticated.sql'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/run-android-maestro-public.sh'
      - '.github/scripts/run-android-maestro-ci.sh'
      - 'apps/android/**'
      - 'apps/android-liquid-glass/**'
      - 'backend/**'
      - 'compose.yaml'
      - '.github/compose.ci.yaml'
      - '.github/scripts/npm-install-retry.mjs'
      - '.github/scripts/validate-ci-compose.mjs'
      - '.github/workflows/android-emulator-smoke.yml'
      - '.github/scripts/seed-android-maestro-authenticated.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-ui:
    name: ${{ matrix.edition }} public Android UI
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - edition: Standard
            app_dir: apps/android
            application_id: com.quantaedge.luckybajaj
          - edition: Liquid Glass
            app_dir: apps/android-liquid-glass
            application_id: com.quantaedge.luckybajajlg
    env:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080/
      EXPO_PUBLIC_CUSTOMER_WEB_URL: http://10.0.2.2:3000
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Install app dependencies and typecheck
        working-directory: ${{ matrix.app_dir }}
        run: |
          node ../../.github/scripts/npm-install-retry.mjs ci
          npx expo install --check
          npm run typecheck
      - name: Generate native Android project
        working-directory: ${{ matrix.app_dir }}
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build self-contained x86_64 Maestro APK
        working-directory: ${{ matrix.app_dir }}/android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=x86_64
      - name: Verify the test APK contains its JavaScript bundle
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
        run: |
          apk="${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'
          abi_dirs="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd ',' -)"
          if [ "$abi_dirs" != "x86_64" ]; then
            echo "Expected x86_64 emulator APK, found: $abi_dirs"
            exit 1
          fi
      - name: Validate the isolated CI Compose topology
        run: node .github/scripts/validate-ci-compose.mjs
      - name: Start clean PostgreSQL-backed local API
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml up --build -d api
      - name: Wait for migrations and seed a synthetic public showroom dealership
        shell: bash
        run: |
          ready=false
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.yaml -f .github/compose.ci.yaml logs --tail=150 api postgres
            exit 1
          fi
          # A fresh CI database intentionally has no real dealership. Create one synthetic
          # storefront after Flyway has created the schema, then publish only catalogue masters.
          # The synthetic customer and motorcycle are seeded separately for authenticated UI tests.
          docker compose -f compose.yaml -f .github/compose.ci.yaml exec -T postgres psql -U bajaj_app -d bajaj_dealership -v ON_ERROR_STOP=1 <<'SQL'
          insert into dealership(code, name, status)
          values ('CI-LUCKY-BAJAJ', 'CI Synthetic Lucky Bajaj', 'ACTIVE')
          on conflict (code) do update set status = 'ACTIVE', name = excluded.name;

          insert into bajaj_catalogue_dealership_model(dealership_id, model_code, is_published)
          select d.id, c.model_code, true
          from dealership d
          cross join bajaj_catalogue_model c
          where d.code = 'CI-LUCKY-BAJAJ' and c.active and c.manufacturer = 'BAJAJ'
          on conflict (dealership_id, model_code) do update set is_published = true;
          SQL
          # Bind this ephemeral API only to the synthetic catalogue dealership. The service
          # otherwise refuses to guess a tenant when more than one is active.
          APP_PUBLIC_DEALERSHIP_CODE=CI-LUCKY-BAJAJ docker compose -f compose.yaml -f .github/compose.ci.yaml up -d --force-recreate api
          ready=false
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.yaml -f .github/compose.ci.yaml logs --tail=150 api postgres
            exit 1
          fi
          curl -fsS http://localhost:8080/api/v1/public/catalogue/bikes -o /tmp/public-catalogue.json
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/public-catalogue.json','utf8')); const bikes=Array.isArray(data)?data:(data.bikes??data.items??[]); if(bikes.length<20) throw new Error('Expected at least 20 published Bajaj models, received '+bikes.length); console.log('Synthetic dealership public catalogue models:',bikes.length);"
      - name: Seed and verify synthetic authenticated customer and motorcycle
        shell: bash
        run: |
          # This script runs only against the fresh, disposable PostgreSQL database created above.
          docker compose -f compose.yaml -f .github/compose.ci.yaml exec -T postgres psql -U bajaj_app -d bajaj_dealership -v ON_ERROR_STOP=1 <<'SQL'
          do $ci$
          declare
            v_dealership_id bigint;
          begin
            select id into v_dealership_id
            from dealership where code = 'CI-LUCKY-BAJAJ' and status = 'ACTIVE';

            if not exists (
              select 1
              from bajaj_spare_part_catalogue catalogue
              join retail_part_catalogue_listing listing
                on listing.dealership_id = v_dealership_id
                and listing.catalogue_product_id = catalogue.id
              join retail_part_catalogue_stock_map stock_map
                on stock_map.dealership_id = v_dealership_id
                and stock_map.catalogue_product_id = catalogue.id
              join spare_part part
                on part.dealership_id = v_dealership_id
                and part.id = stock_map.stock_part_id
              join spare_part_balance balance
                on balance.dealership_id = v_dealership_id and balance.part_id = part.id
              where catalogue.catalogue_code = 'BGP-0001'
                and catalogue.is_global_catalogue = true
                and catalogue.source_data_status = 'NAME_REFERENCE_ONLY'
                and listing.retail_enabled = true
                and listing.retail_price = 199.00
                and listing.fitment_verified = true
                and listing.fitment_model_codes = jsonb_build_array('BAJAJ_PULSAR_NS200')
                and part.sku_code = 'CI-MAESTRO-BRAKE-SHOE'
                and balance.quantity_on_hand = 3.000
                and balance.quantity_reserved = 0.000
            ) then
              raise exception 'Synthetic brake-shoe retail listing is missing stock, price or verified fitment.';
            end if;

            if (select count(*) from staff_user
                where dealership_id = v_dealership_id
                  and email = 'ci-fixture-seeder@lucky-bajaj.invalid'
                  and status = 'DISABLED') <> 1 then
              raise exception 'The CI fixture audit actor must remain disabled.';
            end if;
          end;
          $ci$;
          SQL
          curl -fsS -X POST http://localhost:8080/api/v1/customer/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"dealershipCode":"CI-LUCKY-BAJAJ","customerCode":"CI-MAESTRO-CUSTOMER","password":"CI-Maestro-Only-Password-123"}' \
            -o /tmp/maestro-customer-session.json
          node -e "const s=JSON.parse(require('node:fs').readFileSync('/tmp/maestro-customer-session.json','utf8')); if(!s.accessToken || s.customer?.customerCode!=='CI-MAESTRO-CUSTOMER') throw new Error('Synthetic customer authentication did not return the expected customer session'); console.log('Synthetic customer portal login verified.');"
          token="$(node -p "require('/tmp/maestro-customer-session.json').accessToken")"
          curl -fsS http://localhost:8080/api/v1/customer/parts \
            -H "Authorization: Bearer ${token}" \
            -o /tmp/maestro-customer-parts.json
          node - <<'NODE'
          const fs = require('node:fs');
          const parts = JSON.parse(fs.readFileSync('/tmp/maestro-customer-parts.json', 'utf8'));
          const item = parts.find(part => part.partName === 'Brake shoe');
          if (!item || item.available !== true || Number(item.quantityAvailable) !== 3 || Number(item.retailPrice) !== 199 || item.fitmentVerified !== true) {
            throw new Error('Customer parts API did not expose the expected orderable synthetic brake-shoe item: ' + JSON.stringify(item ?? null));
          }
          if (item.sourceDataStatus !== 'NAME_REFERENCE_ONLY') {
            throw new Error('The CI fixture must not rewrite global OEM/source-verification status.');
          }
          console.log('Customer parts API exposes one stocked, fitment-verified synthetic item; global catalogue source status remains unchanged.');
          NODE
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run public and authenticated Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_DIR: ${{ matrix.app_dir }}
          APPLICATION_ID: ${{ matrix.application_id }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 3G
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -memory 4096 -cores 2 -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "${{ github.workspace }}/.github/scripts/run-android-maestro-ci.sh" "${{ github.workspace }}" "${{ matrix.app_dir }}" "${ANDROID_SERIAL:-emulator-5554}"
      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-${{ matrix.edition }}-${{ github.sha }}
          path: |
            ${{ matrix.app_dir }}/maestro-results/ci/
            ${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local API stack
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml down --volumes --remove-orphans
