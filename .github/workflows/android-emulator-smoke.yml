name: Android emulator UI smoke and authenticated regression

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/android-liquid-glass/**'
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/android-emulator-smoke.yml'
      - '.github/scripts/run-android-maestro-public.sh'
      - '.github/scripts/run-android-maestro-ci.sh'
      - '.github/scripts/seed-android-maestro-authenticated.sql'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/run-android-maestro-public.sh'
      - '.github/scripts/run-android-maestro-ci.sh'
      - 'apps/android/**'
      - 'apps/android-liquid-glass/**'
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-ui:
    name: ${{ matrix.edition }} public Android UI
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - edition: Standard
            app_dir: apps/android
            application_id: com.quantaedge.luckybajaj
          - edition: Liquid Glass
            app_dir: apps/android-liquid-glass
            application_id: com.quantaedge.luckybajajlg
    env:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080/
      EXPO_PUBLIC_CUSTOMER_WEB_URL: http://10.0.2.2:3000
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Install app dependencies and typecheck
        working-directory: ${{ matrix.app_dir }}
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npx expo install --check
          npm run typecheck
      - name: Generate native Android project
        working-directory: ${{ matrix.app_dir }}
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build self-contained x86_64 Maestro APK
        working-directory: ${{ matrix.app_dir }}/android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=x86_64
      - name: Verify the test APK contains its JavaScript bundle
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
        run: |
          apk="${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'
          abi_dirs="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd ',' -)"
          if [ "$abi_dirs" != "x86_64" ]; then
            echo "Expected x86_64 emulator APK, found: $abi_dirs"
            exit 1
          fi
      - name: Start clean PostgreSQL-backed local API
        run: docker compose -f compose.yaml up --build -d api
      - name: Wait for migrations and seed a synthetic public showroom dealership
        shell: bash
        run: |
          ready=false
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.yaml logs --tail=150 api postgres
            exit 1
          fi
          # A fresh CI database intentionally has no real dealership. Create one synthetic
          # storefront after Flyway has created the schema, then publish only catalogue masters.
          # The synthetic customer and motorcycle are seeded separately for authenticated UI tests.
          docker compose -f compose.yaml exec -T postgres psql -U bajaj_app -d bajaj_dealership -v ON_ERROR_STOP=1 <<'SQL'
          insert into dealership(code, name, status)
          values ('CI-LUCKY-BAJAJ', 'CI Synthetic Lucky Bajaj', 'ACTIVE')
          on conflict (code) do update set status = 'ACTIVE', name = excluded.name;

          insert into bajaj_catalogue_dealership_model(dealership_id, model_code, is_published)
          select d.id, c.model_code, true
          from dealership d
          cross join bajaj_catalogue_model c
          where d.code = 'CI-LUCKY-BAJAJ' and c.active and c.manufacturer = 'BAJAJ'
          on conflict (dealership_id, model_code) do update set is_published = true;
          SQL
          # Bind this ephemeral API only to the synthetic catalogue dealership. The service
          # otherwise refuses to guess a tenant when more than one is active.
          APP_PUBLIC_DEALERSHIP_CODE=CI-LUCKY-BAJAJ docker compose -f compose.yaml up -d --force-recreate api
          ready=false
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.yaml logs --tail=150 api postgres
            exit 1
          fi
          curl -fsS http://localhost:8080/api/v1/public/catalogue/bikes -o /tmp/public-catalogue.json
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/public-catalogue.json','utf8')); const bikes=Array.isArray(data)?data:(data.bikes??data.items??[]); if(bikes.length<20) throw new Error('Expected at least 20 published Bajaj models, received '+bikes.length); console.log('Synthetic dealership public catalogue models:',bikes.length);"
      - name: Seed and verify synthetic authenticated customer and motorcycle
        shell: bash
        run: |
          # This script runs only against the fresh, disposable PostgreSQL database created above.
          docker compose -f compose.yaml exec -T postgres psql -U bajaj_app -d bajaj_dealership -v ON_ERROR_STOP=1 < .github/scripts/seed-android-maestro-authenticated.sql
          curl -fsS -X POST http://localhost:8080/api/v1/customer/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"dealershipCode":"CI-LUCKY-BAJAJ","customerCode":"CI-MAESTRO-CUSTOMER","password":"CI-Maestro-Only-Password-123"}' \
            -o /tmp/maestro-customer-session.json
          node -e "const s=JSON.parse(require('node:fs').readFileSync('/tmp/maestro-customer-session.json','utf8')); if(!s.accessToken || s.customer?.customerCode!=='CI-MAESTRO-CUSTOMER') throw new Error('Synthetic customer authentication did not return the expected customer session'); console.log('Synthetic customer portal login verified.');"
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run public and authenticated Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_DIR: ${{ matrix.app_dir }}
          APPLICATION_ID: ${{ matrix.application_id }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "${{ github.workspace }}/.github/scripts/run-android-maestro-ci.sh" "${{ github.workspace }}" "${{ matrix.app_dir }}" "${ANDROID_SERIAL:-emulator-5554}"
      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-${{ matrix.edition }}-${{ github.sha }}
          path: |
            ${{ matrix.app_dir }}/maestro-results/ci/
            ${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local API stack
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
