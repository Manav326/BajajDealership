name: Publish Lucky Bajaj after green main CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: lucky-bajaj-auto-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release-after-ci:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Allocate the next stable version and dispatch its release builder
        uses: actions/github-script@v7
        env:
          BAJAJ_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://api-luckybajaj.quantaedge.in/' }}
          BAJAJ_CUSTOMER_WEB_URL: ${{ vars.BAJAJ_CUSTOMER_WEB_URL || 'https://luckybajaj.quantaedge.in' }}
          BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64 }}
          BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          BAJAJ_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEY_ALIAS }}
          BAJAJ_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEY_PASSWORD }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            if (
              run.event !== "push" ||
              run.head_branch !== "main" ||
              run.repository?.full_name !== `${owner}/${repo}`
            ) {
              core.notice("Ignoring a CI run that did not come from a push to this repository's main branch.");
              return;
            }

            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("The successful CI run did not provide a valid source commit SHA.");
              return;
            }

            // Do not allocate a release for an older main commit if main has advanced.
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            if (branch.commit.sha !== headSha) {
              core.notice(`Skipping ${headSha}: main has advanced to ${branch.commit.sha}; the newer commit will be considered after its CI run.`);
              return;
            }

            const validateOrigin = (name, expectedHost, allowRootSlash) => {
              const value = (process.env[name] ?? "").trim();
              let parsed;
              try { parsed = new URL(value); }
              catch { throw new Error(`${name} must be set to the Lucky Bajaj production HTTPS origin.`); }
              const allowedPaths = ["", "/"];
              if (
                parsed.protocol !== "https:" ||
                parsed.hostname !== expectedHost ||
                (parsed.port && parsed.port !== "443") ||
                parsed.username ||
                parsed.password ||
                !allowedPaths.includes(parsed.pathname) ||
                parsed.search ||
                parsed.hash
              ) {
                throw new Error(`${name} must be the canonical HTTPS origin for ${expectedHost}.`);
              }
            };
            validateOrigin("BAJAJ_API_BASE_URL", "api-luckybajaj.quantaedge.in", true);
            validateOrigin("BAJAJ_CUSTOMER_WEB_URL", "luckybajaj.quantaedge.in", false);

            // Hosted Google OAuth is verified by scripts/publish-luckybajaj-release.ps1
            // on the authorized Windows machine. GitHub-hosted runners can receive Cloudflare 403s.

            // Never create a tag which would immediately fail the signed Android release gate.
            const signingInputs = [
              "BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64",
              "BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD",
              "BAJAJ_ANDROID_SIGNING_KEY_ALIAS",
              "BAJAJ_ANDROID_SIGNING_KEY_PASSWORD",
            ];
            const missingSigningInputs = signingInputs.filter(
              (name) => !(process.env[name] ?? "").trim()
            );
            if (missingSigningInputs.length > 0) {
              core.setFailed(
                `Automatic release was not started because Android signing is not configured. Add the four required Lucky Bajaj Actions secrets: ${missingSigningInputs.join(", ")}.`
              );
              return;
            }

            const parseVersion = (name) => {
              const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(name);
              return match
                ? { name, major: Number(match[1]), minor: Number(match[2]), patch: Number(match[3]) }
                : null;
            };
            const compareVersions = (left, right) =>
              left.major - right.major ||
              left.minor - right.minor ||
              left.patch - right.patch;

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner, repo, per_page: 100,
            });
            const stableTags = tags
              .map((tag) => ({ ...parseVersion(tag.name), commitSha: tag.commit?.sha }))
              .filter((tag) => tag.name)
              .sort((left, right) => compareVersions(right, left));

            // A successful rerun for one commit must not mint a second version.
            const existingForCommit = stableTags.find((tag) => tag.commitSha === headSha);
            let releaseTag;

            if (existingForCommit) {
              releaseTag = existingForCommit.name;
              try {
                const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: releaseTag });
                if (!release.draft) {
                  core.notice(`Release ${releaseTag} is already published for ${headSha}; no duplicate release will be created.`);
                  return;
                }
                core.notice(`Found unpublished draft ${releaseTag}; dispatching a clean release retry.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.notice(`Found tag ${releaseTag} without a release; dispatching its release build.`);
              }
            } else if (stableTags.length > 0) {
              const latest = stableTags[0];
              releaseTag = `v${latest.major}.${latest.minor}.${latest.patch + 1}`;
            } else {
              // Bootstrap from the app's committed version setting when there are no stable tags.
              const { data: sourceFile } = await github.rest.repos.getContent({
                owner, repo, path: "apps/android/app.config.ts", ref: headSha,
              });
              if (Array.isArray(sourceFile) || sourceFile.type !== "file") {
                core.setFailed("Could not read the Android app version from apps/android/app.config.ts.");
                return;
              }
              const source = Buffer.from(sourceFile.content, sourceFile.encoding).toString("utf8");
              const match = /const appVersion = \(process\.env\.BAJAJ_APP_VERSION \|\| '([0-9]+\.[0-9]+\.[0-9]+)'\)\.trim\(\);/.exec(source);
              if (!match) {
                core.setFailed("Could not derive the first stable version from BAJAJ_APP_VERSION in apps/android/app.config.ts.");
                return;
              }
              releaseTag = `v${match[1]}`;
            }

            try {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${releaseTag}`, sha: headSha,
              });
              core.notice(`Created ${releaseTag} at tested main commit ${headSha}.`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: existingRef } = await github.rest.git.getRef({
                owner, repo, ref: `tags/${releaseTag}`,
              });
              if (existingRef.object.sha !== headSha) {
                core.setFailed(`Tag ${releaseTag} already points to ${existingRef.object.sha}, not tested commit ${headSha}; refusing to move or overwrite it.`);
                return;
              }
              core.notice(`Tag ${releaseTag} already points to the tested commit; leaving it unchanged.`);
            }

            // Tags created with GITHUB_TOKEN do not start another workflow; dispatch explicitly.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "release.yml",
              ref: releaseTag,
              inputs: { release_tag: releaseTag },
            });
            core.notice(`Dispatched the versioned Lucky Bajaj release workflow for ${releaseTag} (${headSha}).`);
