name: Release Lucky Bajaj
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to publish (for example v0.2.0)
        required: true
        type: string

concurrency:
  group: lucky-bajaj-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  BAJAJ_API_BASE_URL: ${{ vars.BAJAJ_API_BASE_URL || 'https://api-luckybajaj.quantaedge.in/' }}
  BAJAJ_CUSTOMER_WEB_URL: ${{ vars.BAJAJ_CUSTOMER_WEB_URL || 'https://luckybajaj.quantaedge.in' }}

jobs:
  validate-release:
    name: Validate version and production endpoints
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      api_base_url: ${{ steps.origins.outputs.api_base_url }}
      customer_web_url: ${{ steps.origins.outputs.customer_web_url }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Record exact tagged source commit
        id: source
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate stable semantic version and derive Android version code
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"].strip()
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("Use a stable tag such as v0.2.0; pre-release tags are not published as latest.")
          major, minor, patch = map(int, match.groups())
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if version_code < 1 or version_code > 2_100_000_000:
              raise SystemExit("The semantic version produces an Android versionCode outside the supported range.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={major}.{minor}.{patch}\n")
              output.write(f"version_code={version_code}\n")
          print(f"Validated Lucky Bajaj version {major}.{minor}.{patch}; Android versionCode {version_code}.")
          PY
      - name: Require the Lucky Bajaj Cloudflare production origins
        id: origins
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          def canonical(name, expected_host, allow_trailing_slash):
              raw = os.environ[name].strip()
              parsed = urlsplit(raw)
              try:
                  port = parsed.port
              except ValueError as error:
                  raise SystemExit(f"{name} contains an invalid port.") from error
              allowed_paths = ("", "/") if allow_trailing_slash else ("",)
              if (
                  parsed.scheme != "https"
                  or parsed.hostname != expected_host
                  or port not in (None, 443)
                  or parsed.username
                  or parsed.password
                  or parsed.path not in allowed_paths
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(f"{name} must be the canonical HTTPS origin https://{expected_host}/.")
              normalized = f"https://{expected_host}/" if allow_trailing_slash else f"https://{expected_host}"
              return normalized

          api = canonical("BAJAJ_API_BASE_URL", "api-luckybajaj.quantaedge.in", True)
          customer = canonical("BAJAJ_CUSTOMER_WEB_URL", "luckybajaj.quantaedge.in", False)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"api_base_url={api}\n")
              output.write(f"customer_web_url={customer}\n")
          print(f"API origin: {api}")
          print(f"Customer origin: {customer}")
          PY
      - name: Require Android Google sign-in configuration for both editions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api_base = os.environ["BAJAJ_API_BASE_URL"].rstrip("/") + "/"
          package_ids = {
              "Standard": "com.quantaedge.luckybajaj",
              "Liquid Glass": "com.quantaedge.luckybajajlg",
          }
          for edition, package_id in package_ids.items():
              url = api_base + "api/v1/customer/auth/google/config?" + urlencode({"applicationId": package_id})
              request = Request(url, headers={"Accept": "application/json", "User-Agent": "LuckyBajaj-Release-Preflight"})
              try:
                  with urlopen(request, timeout=20) as response:
                      config = json.loads(response.read())
              except Exception as error:
                  raise SystemExit(f"Could not verify hosted Google sign-in configuration for {edition}: {error}") from error
              if (
                  config.get("configured") is not True
                  or not str(config.get("clientId", "")).strip()
                  or config.get("androidConfigured") is not True
                  or not str(config.get("androidClientId", "")).strip()
              ):
                  raise SystemExit(
                      f"{edition} Google sign-in is not fully configured. "
                      f"Set GOOGLE_WEB_CLIENT_ID and the matching Android OAuth client in the Lucky Bajaj API environment."
                  )
              print(f"{edition}: hosted web and Android OAuth clients are configured.")
          PY
      - name: Reject obsolete Render endpoints in application source
        shell: bash
        run: |
          if git grep -ni "onrender.com" -- apps/; then
            echo "::error::An application source file still references the retired Render deployment."
            exit 1
          fi
          echo "No Render deployment URLs remain in application source."

  windows-desktop:
    name: Build unsigned Windows EXE and MSI
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: ${{ needs.validate-release.outputs.api_base_url }}
      VITE_APP_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.validate-release.outputs.commit_sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set desktop package version
        shell: pwsh
        run: |
          $path = "apps/web/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = $env:RELEASE_VERSION
          $json = $config | ConvertTo-Json -Depth 30
          [System.IO.File]::WriteAllText((Resolve-Path $path), $json + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
      - name: Install desktop dependencies
        working-directory: apps/web
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build Windows desktop packages
        working-directory: apps/web
        run: npm run tauri:build
      - name: Verify hosted API target and stage unsigned installers
        shell: pwsh
        run: |
          $bundles = Get-ChildItem "apps/web/dist-desktop/assets/*.js" -File
          if (-not $bundles) { throw "No desktop JavaScript bundles were produced." }
          if (-not (Select-String -Path $bundles.FullName -SimpleMatch $env:VITE_API_BASE_URL.TrimEnd('/'))) {
            throw "The desktop bundle does not contain the configured Lucky Bajaj API origin."
          }

          $exeFiles = @(Get-ChildItem "apps/web/src-tauri/target/release/bundle/nsis/*.exe" -File)
          $msiFiles = @(Get-ChildItem "apps/web/src-tauri/target/release/bundle/msi/*.msi" -File)
          if ($exeFiles.Count -ne 1 -or $msiFiles.Count -ne 1) {
            throw "Expected exactly one Windows EXE and one MSI; found $($exeFiles.Count) EXE and $($msiFiles.Count) MSI."
          }
          foreach ($installer in @($exeFiles[0], $msiFiles[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected the interim unsigned Windows package; found $($signature.Status) for $($installer.Name)."
            }
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $exeFiles[0].FullName "release-assets/LuckyBajajDesktopSetup.exe"
          Copy-Item $msiFiles[0].FullName "release-assets/LuckyBajajDesktop.msi"
          [PSCustomObject]@{
            version = $env:RELEASE_VERSION
            commit = $env:RELEASE_SOURCE_SHA
            apiBaseUrl = $env:VITE_API_BASE_URL
            signature = "unsigned"
          } | ConvertTo-Json | Set-Content "release-assets/LuckyBajaj-Windows-build.json" -Encoding utf8
      - name: Upload Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  android:
    name: Build signed Android APK (${{ matrix.edition }})
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: standard
            app_directory: apps/android
            package_name: com.quantaedge.luckybajaj
            apk_name: LuckyBajaj-Android.apk
            metadata_name: LuckyBajaj-Android-build.json
          - edition: liquid-glass
            app_directory: apps/android-liquid-glass
            package_name: com.quantaedge.luckybajajlg
            apk_name: LuckyBajaj-LiquidGlass-Android.apk
            metadata_name: LuckyBajaj-LiquidGlass-Android-build.json
    env:
      BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64 }}
      BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      BAJAJ_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEY_ALIAS }}
      BAJAJ_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.BAJAJ_ANDROID_SIGNING_KEY_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: ${{ needs.validate-release.outputs.api_base_url }}
      EXPO_PUBLIC_CUSTOMER_WEB_URL: ${{ needs.validate-release.outputs.customer_web_url }}
      BAJAJ_APP_VERSION: ${{ needs.validate-release.outputs.version }}
      BAJAJ_ANDROID_VERSION_CODE: ${{ needs.validate-release.outputs.version_code }}
      RELEASE_SOURCE_SHA: ${{ needs.validate-release.outputs.commit_sha }}
      APP_DIRECTORY: ${{ matrix.app_directory }}
      PACKAGE_NAME: ${{ matrix.package_name }}
      APK_NAME: ${{ matrix.apk_name }}
      METADATA_NAME: ${{ matrix.metadata_name }}
    steps:
      - name: Check Android upload signing credentials
        shell: bash
        run: |
          missing=0
          for name in BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64 BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD BAJAJ_ANDROID_SIGNING_KEY_ALIAS BAJAJ_ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing required Actions secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Create a dedicated Lucky Bajaj Android upload keystore and configure all four repository Actions secrets before creating a version tag."
            exit 1
          fi
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"
      - name: Install Android dependencies
        working-directory: ${{ matrix.app_directory }}
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Check Expo native dependency versions
        working-directory: ${{ matrix.app_directory }}
        run: npx expo install --check
      - name: Validate version and production URLs in Expo config
        working-directory: ${{ matrix.app_directory }}
        shell: bash
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node - "$RUNNER_TEMP/expo-config.json" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = {
            version: process.env.BAJAJ_APP_VERSION,
            versionCode: Number(process.env.BAJAJ_ANDROID_VERSION_CODE),
            apiBaseUrl: process.env.EXPO_PUBLIC_API_BASE_URL,
            customerWebUrl: process.env.EXPO_PUBLIC_CUSTOMER_WEB_URL,
          };
          if (config.version !== expected.version) throw new Error('Expo version does not match the release tag.');
          if (config.android?.versionCode !== expected.versionCode) throw new Error('Android versionCode does not match the release version.');
          if (config.extra?.apiBaseUrl !== expected.apiBaseUrl) throw new Error('APK API URL does not match the Lucky Bajaj production API.');
          if (config.extra?.customerWebUrl !== expected.customerWebUrl) throw new Error('APK customer website URL does not match the Lucky Bajaj production website.');
          console.log(JSON.stringify({ version: config.version, versionCode: config.android.versionCode, package: config.android.package, apiBaseUrl: config.extra.apiBaseUrl, customerWebUrl: config.extra.customerWebUrl }, null, 2));
          NODE
      - name: Generate native Android project
        working-directory: ${{ matrix.app_directory }}
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Prepare private upload keystore
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/lucky-bajaj-release.jks"
          printf '%s' "$BAJAJ_ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          echo "BAJAJ_ANDROID_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Configure generated Gradle release signing
        run: node scripts/configure-android-release-signing.mjs "$APP_DIRECTORY/android/app/build.gradle"
      - name: Build standalone signed APK
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$APP_DIRECTORY/android"
            ./gradlew :app:assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=arm64-v8a
          )
          apk="$APP_DIRECTORY/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          if ! unzip -Z1 "$apk" | grep -Fxq 'assets/index.android.bundle'; then
            echo "::error::The APK does not contain its standalone JavaScript bundle."
            exit 1
          fi
          abi_dirs="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd ',' -)"
          if [[ "$abi_dirs" != "arm64-v8a" ]]; then
            echo "::error::Expected an arm64-v8a APK; found ABI directories: $abi_dirs"
            exit 1
          fi

          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"
          badging="$("$aapt" dump badging "$apk")"
          grep -F "package: name='$PACKAGE_NAME' versionCode='$BAJAJ_ANDROID_VERSION_CODE' versionName='$BAJAJ_APP_VERSION'" <<< "$badging"

          signer_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$signer_output"
          signer_fingerprint="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' <<< "$signer_output" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          key_fingerprint="$(keytool -list -v -keystore "$BAJAJ_ANDROID_KEYSTORE_FILE" -storepass "$BAJAJ_ANDROID_SIGNING_KEYSTORE_PASSWORD" -alias "$BAJAJ_ANDROID_SIGNING_KEY_ALIAS" 2>/dev/null | sed -nE 's/.*SHA256: ([[:xdigit:]:]{95}).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$signer_fingerprint" || "$signer_fingerprint" != "$key_fingerprint" ]]; then
            echo "::error::APK signature does not match the configured Lucky Bajaj upload keystore."
            exit 1
          fi
          echo "BAJAJ_ANDROID_CERT_SHA256=$signer_fingerprint" >> "$GITHUB_ENV"

          mkdir -p release-assets
          cp "$apk" "release-assets/$APK_NAME"
          node - <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            edition: process.env.APP_DIRECTORY,
            packageName: process.env.PACKAGE_NAME,
            version: process.env.BAJAJ_APP_VERSION,
            versionCode: Number(process.env.BAJAJ_ANDROID_VERSION_CODE),
            apiBaseUrl: process.env.EXPO_PUBLIC_API_BASE_URL,
            customerWebUrl: process.env.EXPO_PUBLIC_CUSTOMER_WEB_URL,
            architecture: ['arm64-v8a'],
            commitSha: process.env.RELEASE_SOURCE_SHA,
            signingCertificateSha256: process.env.BAJAJ_ANDROID_CERT_SHA256,
          };
          fs.writeFileSync('release-assets/' + process.env.METADATA_NAME, JSON.stringify(metadata, null, 2) + '\n');
          NODE
      - name: Upload signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: lucky-bajaj-android-${{ matrix.edition }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: Verify and publish versioned release
    needs:
      - validate-release
      - windows-desktop
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SOURCE_SHA: ${{ needs.validate-release.outputs.commit_sha }}
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: lucky-bajaj-windows-release
          path: release-assets
      - name: Download Standard Android APK
        uses: actions/download-artifact@v4
        with:
          name: lucky-bajaj-android-standard
          path: release-assets
      - name: Download Liquid Glass Android APK
        uses: actions/download-artifact@v4
        with:
          name: lucky-bajaj-android-liquid-glass
          path: release-assets
      - name: Generate SHA-256 checksums and release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          API_BASE_URL: ${{ needs.validate-release.outputs.api_base_url }}
          CUSTOMER_WEB_URL: ${{ needs.validate-release.outputs.customer_web_url }}
        run: |
          set -euo pipefail
          cd release-assets
          binaries=(
            LuckyBajaj-Android.apk
            LuckyBajaj-LiquidGlass-Android.apk
            LuckyBajajDesktopSetup.exe
            LuckyBajajDesktop.msi
          )
          for file in "${binaries[@]}"; do
            test -s "$file"
          done
          sha256sum "${binaries[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'LuckyBajaj-Android.apk',
            'LuckyBajaj-LiquidGlass-Android.apk',
            'LuckyBajajDesktopSetup.exe',
            'LuckyBajajDesktop.msi',
          ];
          const manifest = {
            product: 'Lucky Bajaj',
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_TAG,
            commitSha: process.env.RELEASE_SOURCE_SHA,
            apiBaseUrl: process.env.API_BASE_URL,
            customerWebUrl: process.env.CUSTOMER_WEB_URL,
            packages: files.map(name => ({
              file: name,
              sizeBytes: fs.statSync(name).size,
            })),
            android: { signing: 'verified upload keystore', architecture: ['arm64-v8a'], distribution: 'sideload APK; not a Play Store AAB' },
            windows: { signature: 'unsigned Authenticode; controlled beta/pilot distribution only' },
          };
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Protect published releases and prepare an idempotent draft retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urlopen(Request(f"{api}/repos/{repository}/releases?per_page=100", headers=headers), timeout=30) as response:
              releases = json.loads(response.read())
          release = next((item for item in releases if item.get("tag_name") == tag), None)
          if release is None:
              print(f"No existing release for {tag}; a new draft will be created.")
              raise SystemExit(0)
          if not release.get("draft"):
              raise SystemExit(f"Release {tag} is already published and immutable in this workflow. Create a new version tag.")
          generated = {
              "LuckyBajaj-Android.apk",
              "LuckyBajaj-LiquidGlass-Android.apk",
              "LuckyBajajDesktopSetup.exe",
              "LuckyBajajDesktop.msi",
              "LuckyBajaj-Android-build.json",
              "LuckyBajaj-LiquidGlass-Android-build.json",
              "LuckyBajaj-Windows-build.json",
              "SHA256SUMS.txt",
              "release-manifest.json",
          }
          for asset in release.get("assets", []):
              if asset.get("name") not in generated:
                  continue
              request = Request(f"{api}/repos/{repository}/releases/assets/{asset['id']}", headers=headers, method="DELETE")
              with urlopen(request, timeout=30):
                  pass
          print(f"Draft {tag} is ready for a clean asset upload; published releases are untouched.")
          PY
      - name: Create or update unpublished versioned release draft
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lucky Bajaj ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            ## Included packages
            - Signed Standard Android APK (arm64-v8a).
            - Signed Liquid Glass Android APK (arm64-v8a).
            - Windows desktop Setup EXE and MSI.

            ## Distribution notes
            Android APKs are signed with the configured Lucky Bajaj upload key and are intended for controlled sideload distribution. They are not Google Play AAB submissions.
            Windows EXE/MSI packages are intentionally unsigned. Windows may show Unknown Publisher or SmartScreen warnings. Do not disable Windows security protections; use these packages only for a controlled pilot until Authenticode signing is configured.
            SHA256SUMS.txt contains the SHA-256 checksums for all four binary packages. Verify the checksum before installation.
            All client packages are configured for https://api-luckybajaj.quantaedge.in/.
      - name: Verify release assets and publish stable version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          root = Path("release-assets")
          binaries = {
              "LuckyBajaj-Android.apk",
              "LuckyBajaj-LiquidGlass-Android.apk",
              "LuckyBajajDesktopSetup.exe",
              "LuckyBajajDesktop.msi",
          }
          expected = binaries | {
              "LuckyBajaj-Android-build.json",
              "LuckyBajaj-LiquidGlass-Android-build.json",
              "LuckyBajaj-Windows-build.json",
              "SHA256SUMS.txt",
              "release-manifest.json",
          }
          checksum_map = {}
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              checksum_map[filename.lstrip("*")] = digest
          if set(checksum_map) != binaries:
              raise SystemExit("SHA256SUMS.txt does not contain exactly the four release packages.")
          for filename, expected_digest in checksum_map.items():
              actual = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              if actual != expected_digest:
                  raise SystemExit(f"Local SHA-256 verification failed: {filename}")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urlopen(Request(f"{api}/repos/{repository}/releases?per_page=100", headers=headers), timeout=30) as response:
              releases = json.loads(response.read())
          release = next((item for item in releases if item.get("tag_name") == tag), None)
          if release is None or not release.get("draft"):
              raise SystemExit("The verified release draft is missing or is not unpublished.")
          uploaded = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(uploaded) != expected:
              raise SystemExit(f"Release asset set mismatch. Expected {sorted(expected)}, found {sorted(uploaded)}.")
          for filename in expected:
              asset = uploaded[filename]
              size = (root / filename).stat().st_size
              if size <= 0 or asset.get("size") != size:
                  raise SystemExit(f"Uploaded release asset size mismatch: {filename}.")
              digest = asset.get("digest")
              if filename in checksum_map and digest and digest != "sha256:" + checksum_map[filename]:
                  raise SystemExit(f"GitHub asset digest mismatch: {filename}.")

          payload = json.dumps({"draft": False, "prerelease": False, "make_latest": "true"}).encode("utf-8")
          request = Request(
              f"{api}/repos/{repository}/releases/{release['id']}",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PATCH",
          )
          with urlopen(request, timeout=30) as response:
              published = json.loads(response.read())
          if published.get("draft") or published.get("tag_name") != tag:
              raise SystemExit("GitHub did not confirm the published Lucky Bajaj release.")
          print(f"Published Lucky Bajaj {tag} with four verified binary packages and SHA256SUMS.txt.")
          PY
