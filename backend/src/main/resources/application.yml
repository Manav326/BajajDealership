spring:
  application:
    name: bajaj-dealership-api
  datasource:
    url: "${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bajaj_dealership}}"
    username: ${DB_USERNAME:bajaj_app}
    password: ${DB_PASSWORD:bajaj_local_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  version: ${APP_VERSION:development}
  cors:
    # Empty by default: local dev and Docker use same-origin API proxies.
    # Production/preview deployment injects explicit frontend origins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-origin-1: ${APP_CORS_ALLOWED_ORIGIN_1:}
    allowed-origin-2: ${APP_CORS_ALLOWED_ORIGIN_2:}
  notifications:
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:15000}
    media-root: ${APP_NOTIFICATION_MEDIA_DIR:./var/private-notification-media}
  social:
    media:
      storage-backend: ${SOCIAL_MEDIA_STORAGE_BACKEND:filesystem}
      public-base-url: ${SOCIAL_MEDIA_PUBLIC_BASE_URL:}
      media-root: ${SOCIAL_MEDIA_MEDIA_DIR:./var/social-media-assets}
      asset-signing-key-base64: ${SOCIAL_MEDIA_ASSET_SIGNING_KEY_BASE64:}
      s3:
        bucket: ${SOCIAL_MEDIA_S3_BUCKET:}
        region: ${SOCIAL_MEDIA_S3_REGION:}
        endpoint: ${SOCIAL_MEDIA_S3_ENDPOINT:}
        access-key: ${SOCIAL_MEDIA_S3_ACCESS_KEY:}
        secret-key: ${SOCIAL_MEDIA_S3_SECRET_KEY:}
        path-style-access: ${SOCIAL_MEDIA_S3_PATH_STYLE_ACCESS:true}
    meta:
      publish-poll-interval-ms: ${SOCIAL_MEDIA_PUBLISH_POLL_INTERVAL_MS:15000}
      enabled: ${SOCIAL_META_ENABLED:false}
      app-id: ${SOCIAL_META_APP_ID:}
      app-secret: ${SOCIAL_META_APP_SECRET:}
      graph-api-version: ${SOCIAL_META_GRAPH_API_VERSION:}
      redirect-uri: ${SOCIAL_META_REDIRECT_URI:}
      completion-url: ${SOCIAL_META_COMPLETION_URL:}
      token-encryption-key-base64: ${SOCIAL_META_TOKEN_ENCRYPTION_KEY_BASE64:}
    whatsapp:
      enabled: ${SOCIAL_WHATSAPP_ENABLED:false}
      phone-number-id: ${SOCIAL_WHATSAPP_PHONE_NUMBER_ID:}
      business-account-id: ${SOCIAL_WHATSAPP_BUSINESS_ACCOUNT_ID:}
      access-token: ${SOCIAL_WHATSAPP_ACCESS_TOKEN:}
      verify-token: ${SOCIAL_WHATSAPP_VERIFY_TOKEN:}
      dealership-code: ${SOCIAL_WHATSAPP_DEALERSHIP_CODE:}
  bootstrap:
    token: ${APP_BOOTSTRAP_TOKEN:}
