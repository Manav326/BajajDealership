spring:
  application:
    name: bajaj-dealership-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bajaj_dealership}
    username: ${DB_USERNAME:bajaj_app}
    password: ${DB_PASSWORD:bajaj_local_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  version: ${APP_VERSION:development}
  bootstrap:
    token: ${APP_BOOTSTRAP_TOKEN:}
